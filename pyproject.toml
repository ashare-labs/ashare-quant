[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "ashare-quant"
version = "0.11.0.dev14"
description = "A宽 local bounded research backend with portable owner bindings"
readme = "README.md"
license-files = ["docs/licensing.md", "docs/rqalpha/RQAlpha-LICENSE.txt"]
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1", "pydantic==2.13.5", "uvicorn==0.52.4",
  "ashare-data==0.8.0.dev2", "numpy==2.5.3",
  "jsonpickle==4.1.3", "simplejson==4.2.0", "logbook==1.10.1",
]

[project.optional-dependencies]
# Read docs/licensing.md before installing. Data must be supplied through A数达.
native = [
  "annotated-doc==0.0.5",
  "annotated-types==0.8.0",
  "anyio==4.15.1",
  "certifi==2026.7.22",
  "charset-normalizer==3.5.2",
  "click==8.5.0",
  "contourpy==1.4.0",
  "cycler==0.12.1",
  "duckdb==1.4.3",
  "et-xmlfile==2.0.0",
  "fastapi==0.141.1",
  "filelock==4.0.12",
  "fonttools==4.66.1",
  "formulaic==1.2.2",
  "h11==0.16.0",
  "h5py==3.16.0",
  "hdf5plugin==7.1.0",
  "idna==3.19",
  "interface-meta==2.0.1",
  "jsonpickle==4.1.3",
  "kiwisolver==1.5.1",
  "logbook==1.10.1",
  "matplotlib==3.11.2",
  "methodtools==0.4.7",
  "narwhals==2.26.0",
  "numpy==2.5.3",
  "openpyxl==3.1.5",
  "packaging==26.3",
  "pandas==2.3.3",
  "patsy==1.0.3",
  "pillow==12.3.0",
  "pydantic==2.13.5",
  "pydantic-core==2.46.5",
  "pyparsing==3.3.3",
  "python-dateutil==2.9.0.post0",
  "pytz==2026.5",
  "pyyaml==6.0.3",
  "requests==2.34.2",
  "rqalpha==6.4.1",
  "rqrisk==1.0.13",
  "scipy==1.18.1",
  "simplejson==4.2.0",
  "six==1.17.0",
  "starlette==1.6.0",
  "statsmodels==0.15.0",
  "tabulate==0.10.0",
  "typing-extensions==4.16.0",
  "typing-inspection==0.4.4",
  "tzdata==2026.5",
  "urllib3==2.8.0",
  "uvicorn==0.52.4",
  "wirerope==1.0.0",
  "wrapt==2.5.0"
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/ashare_quant", "src/rqprobe"]

# Only these public inputs enter source distributions. Research evidence stays local.
[tool.hatch.build.targets.sdist]
include = [
  "/.gitignore", "/.python-version", "/README.md", "/pyproject.toml", "/uv.lock",
  "/requirements-core.txt", "/requirements-native.txt",
  "/src", "/tests", "/examples", "/scripts",
  "/tools/round_one_reference_mechanisms.py",
  "/docs/compatibility.md", "/docs/research.md", "/docs/strategies.md",
  "/docs/diagnostics.md", "/docs/development.md", "/docs/licensing.md",
  "/docs/second-batch.md",
  "/docs/daily-paper.md",
  "/docs/daily-portfolio.md",
  "/docs/python-minute.md",
  "/docs/paper-integration.md",
  "/docs/paper-execution.md",
  "/docs/rqalpha/RQAlpha-LICENSE.txt",
]

[project.scripts]
ashare-quant = "ashare_quant.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1", "httpx==0.28.1", "ruff==0.16.6", "packaging==26.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["src/rqprobe"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.uv.sources]
# Build this artifact from the fixed public source with scripts/stage_owner.py before sync.
ashare-data = { path = "local-dependencies/ashare_data-0.8.0.dev2-py3-none-any.whl" }
